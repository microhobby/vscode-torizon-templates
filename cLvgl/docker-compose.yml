services:
  __container__-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ${LOCAL_REGISTRY}:5002/__container__-debug:${TAG}
    ports:
    - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
    device_cgroup_rules:
    - c 4:* rmw
    - c 13:* rmw
    - c 226:* rmw
    - c 199:* rmw
    - c 29:* rmw
    volumes:
    - type: bind
      source: /dev
      target: /dev
    profiles:
    - debug
  __container__:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_LOGIN}/__container__:${TAG}
    device_cgroup_rules:
    - c 4:* rmw
    - c 13:* rmw
    - c 226:* rmw
    - c 199:* rmw
    - c 29:* rmw
    volumes:
    - type: bind
      source: /dev
      target: /dev
    profiles:
    - release
